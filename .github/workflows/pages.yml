name: gallery

# Build the "wrapped" HTML gallery from commit history and publish it to GitHub
# Pages on every push to main.
#
# One-time setup (maintainer): repo Settings -> Pages -> Source = "GitHub
# Actions". Then this deploys https://<owner>.github.io/<repo>/ automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so wrapped sees every commit poem
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Build the gallery
        run: |
          mkdir -p _site
          commit-bard wrapped --format html --top 50 > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
