name: publish

# Build and publish to PyPI when a GitHub Release is published, using PyPI
# Trusted Publishing (OIDC) — no API token stored in the repo.
#
# One-time setup (maintainer): create the project's trusted publisher on PyPI
# (Publishing -> add a GitHub publisher for this repo + workflow), then cut a
# GitHub Release. The `pypi` environment can be created in repo settings.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
